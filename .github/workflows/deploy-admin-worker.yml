name: Deploy admin file manager

# R2-Explorer over the private bucket. Independent of the public site.
# Manual only. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as
# repository secrets; without them use `npx wrangler deploy` locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      # The dashboard ships inside the package and is uploaded as static
      # assets, so dependencies must be present before deploying.
      - run: pnpm install --frozen-lockfile

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          command: deploy
