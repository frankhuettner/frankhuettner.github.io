name: Deploy site to GitHub Pages

# MANUAL ONLY, on purpose. This force-pushes to gh-pages, which is what
# currently serves huettner.io — running it replaces the live site with the
# Astro build. Leave it manual until you have decided to cut over, then add
# a `push` trigger on main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: astro/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # dist/ carries CNAME (huettner.io) and .nojekyll, so the custom domain
      # survives and Pages does not strip Astro's _astro/ directory.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: astro/dist
