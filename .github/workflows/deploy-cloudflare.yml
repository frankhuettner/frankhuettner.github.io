name: Deploy to Cloudflare

# Scoped to the rebuild branch until the cutover. After promoting the Astro site,
# change this to `master` and delete the old `deploy.yml` (GitHub Pages) workflow.
on:
  push:
    branches: [astro-rebuild]
    paths:
      - "astro/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: astro
          command: deploy
